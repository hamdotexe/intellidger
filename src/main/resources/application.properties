spring.application.name=intellidger
# a desktop app: no web server, and AWT/JavaFX may open windows
spring.main.web-application-type=none
spring.main.banner-mode=off

# intellidger.data-folder is %LOCALAPPDATA%\Intellidger, set by DesktopApp at start (see AppDataFolder)
spring.datasource.url=jdbc:sqlite:${intellidger.data-folder}/intellidger.db?foreign_keys=true&journal_mode=WAL&busy_timeout=5000
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite takes one writer at a time; one connection queues writes in the app instead of failing them as busy
spring.datasource.hikari.maximum-pool-size=1

# the schema is Flyway's (src/main/resources/db/migration); Hibernate only checks the entities match it
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
# the SQLite driver answers "every table's columns" with one compound SELECT, which passes SQLite's 500-term limit
# once there are this many tables; asking table by table stays under it
spring.jpa.properties.hibernate.hbm2ddl.jdbc_metadata_extraction_strategy=individually
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.org.hibernate.envers.audit_table_suffix=_aud
spring.jpa.properties.org.hibernate.envers.revision_field_name=rev
spring.jpa.properties.org.hibernate.envers.revision_type_field_name=revtype
